<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1815">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Iron Log">
<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="A no-frills strength training logbook. Works offline, keeps your data on your phone.">
<title>Iron Log</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <header class="app-header">
    <div class="brand">
      <svg class="plate-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14" class="pm-body"></circle>
        <circle cx="16" cy="16" r="14" class="pm-rim" fill="none"></circle>
        <circle cx="16" cy="16" r="5.5" class="pm-brass" fill="none"></circle>
        <circle cx="16" cy="16" r="3" class="pm-hole"></circle>
      </svg>
      <span class="brand-name">IRON LOG</span>
    </div>
    <button id="btn-settings" class="icon-btn" aria-label="Settings" title="Backup &amp; settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 3.5c0 .4 0 .8-.06 1.18l1.86 1.45a.7.7 0 0 1 .16.9l-1.76 3.05a.7.7 0 0 1-.85.31l-2.2-.88c-.65.5-1.37.9-2.14 1.17l-.33 2.34a.7.7 0 0 1-.7.6h-3.5a.7.7 0 0 1-.7-.6l-.33-2.34a7.9 7.9 0 0 1-2.14-1.17l-2.2.88a.7.7 0 0 1-.85-.31L2.9 15.63a.7.7 0 0 1 .16-.9l1.86-1.45A8.6 8.6 0 0 1 4.86 12c0-.4.02-.8.08-1.18L3.07 9.37a.7.7 0 0 1-.16-.9L4.67 5.4a.7.7 0 0 1 .85-.31l2.2.88c.65-.5 1.37-.9 2.14-1.17l.33-2.34a.7.7 0 0 1 .7-.6h3.5a.7.7 0 0 1 .7.6l.33 2.34c.77.27 1.49.67 2.14 1.17l2.2-.88a.7.7 0 0 1 .85.31l1.76 3.05a.7.7 0 0 1-.16.9l-1.86 1.45c.05.38.07.78.07 1.18z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <main id="views">
    <section id="view-log" class="view" data-view="log"></section>
    <section id="view-history" class="view" data-view="history"></section>
    <section id="view-exercises" class="view" data-view="exercises"></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab-btn" data-target="log" aria-label="Log">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M14 3v4h4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 12h8M8 15.5h8M8 8.5h3" stroke="currentColor" stroke-width="1.4"/></svg>
      <span>Log</span>
    </button>
    <button class="tab-btn" data-target="history" aria-label="History">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M3 4v4.5h4.5" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M12 8v4.5l3.5 2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      <span>History</span>
    </button>
    <button class="tab-btn" data-target="exercises" aria-label="Exercises">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8v8M20 8v8" stroke="currentColor" stroke-width="1.6"/><path d="M2 12h1.2M20.8 12H22" stroke="currentColor" stroke-width="1.6"/><rect x="6" y="9.5" width="3" height="5" rx="0.6" fill="currentColor"/><rect x="15" y="9.5" width="3" height="5" rx="0.6" fill="currentColor"/><path d="M9 12h6" stroke="currentColor" stroke-width="1.6"/></svg>
      <span>Exercises</span>
    </button>
  </nav>

</div>

<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
